# x4 fine-tune from the x2 500k weights (GatedMambaIR_SR_x2_lean_chgate_500k), as MambaIRv2 does for x3/x4, shortened to 100k
# (paper: 250k) to fit the deadline. lr 1e-4, schedule = paper x3/x4 schedule scaled by 0.4. batch 2 (V100).
# Same recipe for MambaIRv2 and GatedMambaIR lean.
name: GatedMambaIR_SR_x4_lean_chgate_ft100k
model_type: GatedMambaIRModel
scale: 4
num_gpu: 1
manual_seed: 10

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: /speed-scratch/se_gham/GatedMambaIR/datasets/DF2K/DF2K/HR
    dataroot_lq: /speed-scratch/se_gham/GatedMambaIR/datasets/DF2K/DF2K/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4  # 8 crashed the baseline 500k (shared memory)
    batch_size_per_gpu: 2  # V100 32GB
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: /speed-scratch/se_gham/GatedMambaIR/datasets/SR/Set14/HR
    dataroot_lq: /speed-scratch/se_gham/GatedMambaIR/datasets/SR/Set14/LR_bicubic/X4
    filename_tmpl: '{}x4'
    io_backend:
      type: disk

network_g:
  type: GatedMambaIR
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.
  embed_dim: 174
  d_state: 16
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  key_ratio: 0.25
  head_dim: 87  # 1 head x 87 keys
  use_prompt: true
  use_lowrank: false
  rank: 16
  use_delta: true
  chunk_size: 128  # channel gate needs <= 160
  gate: channel
  lean: true  # size-matched: 25.1M params vs MambaIRv2-B 22.9M

# path
path:
  pretrain_network_g: /speed-scratch/se_gham/GatedMambaIR/experiments/GatedMambaIR_SR_x2_lean_chgate_500k/models/net_g_500000.pth
  strict_load_g: false  # x2 upsampler weights have a different shape and are skipped
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [50000, 80000, 90000, 95000]
    gamma: 0.5

  total_iter: 100000
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e3
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
